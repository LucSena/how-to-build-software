# Stateless HTTP service on Kubernetes: deploy by digest, probes, graceful shutdown, resources,
# zone spread, hardened securityContext, and a PodDisruptionBudget.
# Replace <digest>, <git-sha>, names, and sizes. Size resources from observed usage, not guesses.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 }    # never drop below desired capacity
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      # Must cover preStop (5s) + app drain (app hard-stops at 25s) + buffer.
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: api } }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001                                   # overrides the image USER; app files must be readable by this UID
        seccompProfile: { type: RuntimeDefault }
      dnsConfig:
        options:
          - { name: ndots, value: "2" }                    # default ndots:5 multiplies external DNS lookups
      containers:
        - name: api
          image: registry.example.com/api@sha256:<digest>  # deploy by digest, never a mutable tag
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: APP_VERSION, value: "<git-sha>" }
          envFrom:
            - configMapRef: { name: api-config }           # non-secret config only
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets, readOnly: true }   # synced from a vault (ESO/CSI)
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 512Mi }                      # memory request = limit; no CPU limit (throttling trade-off)
          startupProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 2
            failureThreshold: 30                           # up to 60s to boot before liveness applies
          readinessProbe:
            httpGet: { path: /readyz, port: http }         # 503 while warming up or shutting down
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /livez, port: http }          # process only — never checks the database
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep: { seconds: 5 }                        # let endpoints/LBs drop the pod before SIGTERM handling
              # Clusters without the native sleep action: exec: { command: ["sleep", "5"] } (needs a shell/sleep binary)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: secrets
          secret: { secretName: api-secrets }
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: api }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 80, targetPort: http }
